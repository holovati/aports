# Image profiles for emx-mkimage. Package names must exist in this aports tree, no profile
# may need a package that has no APKBUILD.
#
# Keys
#   extends          inherit packages and flags from another profile
#   packages         installed into the image (apk resolves the dependencies)
#   all_makedepends  also install the makedepends of every aport (a machine that can build everything)
#   ship_aports      copy this aports checkout to /root/aports
#   rebuild_script   install /usr/local/bin/emx-rebuild-all, run it after logging in to build every
#                    aport with the toolchain installed in the image, in the foreground. Nothing
#                    builds by itself. The image contains no .apk files, /root/packages starts empty
#   serve_port       install /usr/local/bin/emx-repohost, run it by hand to serve /root/packages over
#                    HTTP on this port (needs python3). Nothing starts at boot

# base: what Debian's netinst image gives you that aports already has. The user adds the rest
# with `apk add`.
#
# Debian essential/required/important packages with no aport yet, so left out:
#   dpkg (apk-tools replaces it), debianutils, procps, iproute2, iputils-ping, kmod, udev,
#   ifupdown, isc-dhcp-client, man-db, tzdata, locales, cron, rsyslog, logrotate, tasksel
[base]
description = "Boots to a login prompt. Debian netinst equivalent, apk add whatever else you need"
packages = [
    "emx-base",         # the system itself: baselayout, init, login, apk, core userland
    "kernel",
    "emerixx-loader",
    # Choices and extras the user can apk del
    "nano",
    "vi",
    "less",
    "file",
    "bzip2",
    "xz",
    "zstd",
    "unzip",
    "perl",
    "fuse3",
    "openssh",
    "curl",
    "wget",
]

[builder]
description = "Toolchain and the aports tree, run emx-rebuild-all to build every package and host the result"
extends = "base"
ship_aports = true
rebuild_script = true
serve_port = 8080
packages = [
    "abuild",
    "gcc",
    "binutils",
    "make",
    "patch",
    "pkgconf",
    "autoconf",
    "automake",
    "libtool",
    "m4",
    "bison",
    "flex",
    "gperf",
    "help2man",
    "texinfo",
    "cmake",
    "meson",
    "ninja",
    "python3",
    "py3-elftools",
    "git",
    "cpio",
    "libarchive",
    "mtools",
    "dosfstools",
    "parted",
]
